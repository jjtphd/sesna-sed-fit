[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sesnasedfit"
version = "0.1.0"
description = "SED fitting and Bayesian imputation tools for the SESNA survey"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Josh Taylor", email = "joshtaylor@utexas.edu"}
]
requires-python = ">=3.9"
dependencies = [
    # Core scientific stack
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "astropy>=5.3",
    # HDF5 I/O
    "h5py>=3.8",
    "tables>=3.9",        # PyTables — used by io.py via pd.HDFStore
    # Gaia cross-match
    "astroquery>=0.4.6",
    # Nearest-neighbour search (used in io.py for DCOMP90 NN lookup)
    "faiss-cpu>=1.7",
    # Dust extinction maps (spatial prior)
    "dustmaps>=1.0",
    # SED fitting (install from source; see README)
    "sedfitter>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.urls]
Repository = "https://github.com/jjtphd/sesna-sed-fit"
Issues = "https://github.com/jjtphd/sesna-sed-fit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sesnasedfit = [
    "data/GaiaEDR3_passbands_zeropoints_version2/*",
    "data/gref_cache_*.hdf5",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39"]